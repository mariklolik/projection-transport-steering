[project]
name = "projection-transport-steering"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "math-verify==0.9.0",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
]

[build-system]
requires = ["uv_build>=0.8.23,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812", "ISC001"]

[tool.ty.environment]
python-version = "3.11"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
    "ty>=0.0.78",
]
experiment = [
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "pyvene==0.1.8",
    "scikit-learn>=1.9.0",
    "torch>=2.14.0",
    "transformers>=5.16.1",
]
